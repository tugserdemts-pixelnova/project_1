<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>To-Do List</h1>
  <p class="sub">Add a task, tick it off, and it stays saved in this browser.</p>
  <div class="card">
    <form id="form">
      <input type="text" id="input" placeholder="What needs doing?" aria-label="New task" maxlength="120" autocomplete="off">
      <button class="primary" type="submit">Add task</button>
    </form>
    <div class="filters" role="group" aria-label="Filter tasks">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">Active</button>
      <button data-f="done" aria-pressed="false">Done</button>
    </div>
    <ul id="list"></ul>
    <div class="foot">
      <span id="count"></span>
      <button id="clear">Clear completed</button>
    </div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
